services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: consentshield
      POSTGRES_PASSWORD: consentshield
      POSTGRES_DB: consentshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consentshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://consentshield:consentshield@postgres:5432/consentshield
      DATABASE_URL_SYNC: postgresql://consentshield:consentshield@postgres:5432/consentshield
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ../storage:/app/storage
      - ../models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - api

  # Future ML microservice — reserved, not started by default
  # ml-service:
  #   profiles: ["ml"]
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile.ml
  #   ports:
  #     - "8001:8001"

volumes:
  pgdata:

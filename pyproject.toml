[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consentshield"
version = "0.1.0"
description = "AI-powered consent dark pattern detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.17",
  "email-validator>=2.2.0",
  "redis>=5.2.0",
  "httpx>=0.28.0",
  "pyyaml>=6.0.2",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "Pillow>=10.4.0",
  "reportlab>=4.2.0",
]

[project.optional-dependencies]
ai = [
  "torch>=2.5.0",
  "transformers>=4.46.0",
  "opencv-python-headless>=4.10.0",
  "xgboost>=2.1.0",
]
dev = [
  "ruff>=0.8.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
